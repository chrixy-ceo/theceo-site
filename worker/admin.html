<!doctype html>
<html lang="en">
<head>

<title>Site Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#14171f;--mu:#667085;--ln:#e4e7ec;--ac:#0f9f8f;--ac2:#0b7d71;--acbg:#e6f6f4;--er:#d92d20;--ok:#079455;--wa:#dc6803;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}

.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}.btn.d{color:var(--er)}.btn.d:hover{border-color:var(--er)}.btn:disabled{opacity:.5;cursor:wait}.btn.sm{padding:5px 10px;font-size:13px}

textarea{min-height:90px;resize:vertical}textarea.code{font:13px/1.55 ui-monospace,Menlo,monospace}

nav{display:flex;flex-direction:column}nav .mainnav a{padding:9px 10px;font-weight:500;justify-content:flex-start;gap:10px}nav .mainnav a i{font-style:normal;width:20px;text-align:center;color:var(--mu)}nav .mainnav a.on i{color:var(--ac)}nav .mainnav a .badge{margin-left:auto}

nav a:hover{background:var(--bg)}nav a.on{background:var(--acbg);color:var(--ac);font-weight:600}

main{padding:24px 28px 120px;max-width:1150px;width:100%;min-width:0}

.stat b{display:block;font-size:24px}.stat span{color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600}
tr.row{cursor:pointer}tr.row:hover td{background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--ln);white-space:nowrap}.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--ln))}.pill.er{color:var(--er)}.pill.wa{color:var(--wa);border-color:color-mix(in srgb,var(--wa) 35%,var(--ln))}.pill.ac{color:var(--ac)}
.mu{color:var(--mu)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.full{grid-column:1/-1}

.sect{margin-bottom:16px}.sect>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.sect>summary::-webkit-details-marker{display:none}.sect>summary::after{content:'▾';color:var(--mu)}.sect:not([open])>summary::after{content:'▸'}
.li{border:1px solid var(--ln);border-radius:12px;padding:4px 14px 14px;margin-bottom:10px;background:var(--bg)}.li-h{display:flex;justify-content:space-between;align-items:center;padding-top:8px}.li-h b{font-size:13px;color:var(--mu)}.li-h span{display:flex;gap:4px}
.status{display:flex;gap:0;border:1px solid var(--ln);border-radius:10px;overflow:hidden;width:max-content}.status button{border:0;background:var(--pn);padding:8px 14px;cursor:pointer;font-weight:500}.status button[aria-pressed=true]{background:var(--ac);color:#fff}

#pal .box{width:min(620px,92vw);background:var(--pn);border:1px solid var(--ln);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}

#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}#pal li a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;color:var(--tx);text-decoration:none}#pal li a span{color:var(--mu);font-size:12.5px}#pal li a.sel{background:var(--acbg)}
#toast{position:fixed;bottom:76px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:99}#toast div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--sh);max-width:380px}#toast div.er{background:var(--er);color:#fff}
.login{max-width:380px;margin:12vh auto}.chk{margin:8px 0 0;padding-left:18px}.chk li{margin:4px 0}
#mbtn{display:none}#scrim{display:none}
@media(max-width:820px){#app{grid-template-columns:1fr}nav{position:fixed;inset:0 auto 0 0;width:min(300px,84vw);z-index:50;transform:translateX(-105%);transition:transform .22s ease;height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.4)}nav.open{transform:none}nav.open+#scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5)}
#mbtn{display:inline-flex}main{padding:12px 14px 120px}.ed,.row2{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px 14px;padding:10px 14px;border-bottom:1px solid var(--ln)}.top h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actions{width:100%}#actions .btn{flex:1;justify-content:center}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border-radius:12px}
table.resp thead,table.resp tr:has(th){display:none}table.resp tr{display:block;padding:12px 4px;border-bottom:1px solid var(--ln)}table.resp td{display:inline;border:0;padding:0 8px 0 0}table.resp td:first-child{display:block;margin-bottom:4px}
.pv{display:none}.ed.show-pv .pv{display:block}.ed.show-pv textarea{display:none}#pvt{display:inline-flex!important}textarea.code{min-height:50vh!important}
input,select,textarea{font-size:16px}.media{grid-template-columns:1fr 1fr}#toast{left:12px;right:12px;bottom:76px}.savebar{left:0;padding:10px 14px}}
</style>

<body>
<div id="root"></div><div id="toast"></div>
<div id="pal" role="dialog" aria-label="Search"><div class="box"><input id="palq" placeholder="Search posts, opportunities, pages, settings…" autocomplete="off"><ul id="pall"></ul></div></div>
<script>
const COLLECTIONS = {
  posts:          { label: 'Blog posts',     one: 'blog post',     dir: 'src/content/posts',          type: 'md',   public: s => '/blog/' + s + '/', hint: 'Articles on your blog. Auto-posts arrive here as drafts.' },
  opportunities:  { label: 'Opportunities',  one: 'opportunity',   dir: 'src/content/opportunities',  type: 'md',   public: s => '/infobytes/' + s + '/', hint: 'Scholarships, jobs, grants and fellowships listed on Infobytes.' },
  projects:       { label: 'Projects',       one: 'project',       dir: 'src/content/projects',       type: 'json', public: s => '/projects/' + s + '/', hint: 'The work shown on your portfolio home page.' },
  certifications: { label: 'Certifications', one: 'certification', dir: 'src/content/certifications', type: 'json', hint: 'Shown under the Certifications tab on your home page.' },
  pages:          { label: 'Pages',          one: 'page',          dir: 'src/content/pages',          type: 'md',   public: s => '/' + s + '/', hint: 'About, Contact, Privacy, Terms and Disclaimer pages.' },
};
// Side menu: a few sections; each section's pages appear as tabs at the top of the page.
const SECTIONS = [
  { id: 'home', label: 'Home', icon: '⌂', tabs: [['dashboard', 'Overview']] },
  { id: 'blog', label: 'Blog', icon: '✎', tabs: [['c/posts', 'Posts'], ['drafts', 'Drafts']] },
  { id: 'info', label: 'Infobytes', icon: '◎', tabs: [['c/opportunities', 'Opportunities']] },
  { id: 'site', label: 'Website', icon: '▤', tabs: [['s/settings.json', 'Profile'], ['s/about.json', 'About'], ['c/projects', 'Projects'], ['s/services.json', 'Services'], ['s/stack.json', 'Tools'], ['c/certifications', 'Certifications'], ['c/pages', 'Pages'], ['s/site.json', 'Blog & ads settings']] },
  { id: 'media', label: 'Media', icon: '▣', tabs: [['media', 'Images & files']] },
  { id: 'auto', label: 'Auto-posting', icon: '↻', tabs: [['news', 'Auto-posting']] },
  { id: 'acct', label: 'Account', icon: '≡', tabs: [['account', 'Password & login'], ['activity', 'Activity log']], hidden: true },
];
const sectionOf = h => SECTIONS.find(sec => sec.tabs.some(([t]) => h === t || h.startsWith(t + '/'))) || SECTIONS[0];
const SETTINGS = {
  'settings.json': { label: 'Homepage & profile', hint: 'Your name, headline, photo, menu labels, social links and contact details.' },
  'about.json':    { label: 'About text',         hint: 'The paragraphs in the About section of your home page.' },
  'services.json': { label: 'Services',           hint: 'What you offer. Add, remove or reorder services.' },
  'stack.json':    { label: 'Tools',              hint: 'The tools shown in your stack. Add, remove or reorder.' },
  'site.json':     { label: 'Blog, Infobytes & ads', hint: 'Titles, share images, newsletter and AdSense.' },
};
// Friendly names for fields. Anything not listed gets a readable version of its key.
const NAMES = {
  name: 'Full name', short_name: 'Short name', headline: 'Homepage headline', photo: 'Profile photo', logo: 'Logo', favicon: 'Browser tab icon',
  seo_title: 'Title in Google', seo_description: 'Description in Google', default_og_image: 'Default share image', home_og_image: 'Home page share image', og_image: 'Share image (social media)',
  whatsapp: 'WhatsApp number', linkedin: 'LinkedIn link', x: 'X (Twitter) link', github: 'GitHub link', cv: 'CV file', cv_title: 'CV heading', cv_button: 'CV button text',
  cta_title: 'Contact heading', cta_text: 'Contact text', footer: 'Footer text', blog_url: 'Blog link', infobytes_url: 'Infobytes link', contact_email: 'Contact email',
  adsense_client: 'AdSense publisher ID', ads_enabled: 'Show ads', ad_slot: 'AdSense ad unit ID', newsletter_link: 'Newsletter sign-up page link', newsletter_form_action: 'Newsletter form address',
  newsletter_email_name: 'Newsletter email field name', newsletter_button: 'Newsletter button text', apply_url: 'Apply link', organization_logo: 'Organisation logo', organization: 'Organisation',
  image: 'Cover image', date: 'Publish date', deadline: 'Deadline', category: 'Category', title: 'Title', description: 'Short description', tools: 'Tools used', link: 'Link',
  cover_image: 'Cover image', client_logo: 'Client logo', certificate_image: 'Certificate image', certificate_pdf: 'Certificate PDF', issuer: 'Issued by', issuer_logo: 'Issuer logo', year: 'Year',
  paragraphs: 'Paragraphs', items: 'Services', tools_list: 'Tools', source: 'Source', source_url: 'Source link', draft: 'Status', updated: 'Last updated',
};
const HINTS = {
  whatsapp: 'Country code and number, no + or spaces. Example: 2348012345678', short_name: 'Shown on small screens, e.g. C.E.O.', headline: 'The big line under your photo.',
  seo_title: 'Shown in Google results and browser tabs.', seo_description: 'One or two sentences shown under the title in Google.', og_image: 'Shown when the link is shared on WhatsApp, X, LinkedIn…',
  default_og_image: 'Used when a page has no share image of its own.', adsense_client: 'Starts with ca-pub-', category: 'Pick an existing category or type a new one.',
  description: 'Shown in lists and in Google. Keep it under 160 characters.', deadline: 'Leave empty (or click No deadline) if there is none: it stays Open and is listed first. Past deadlines show as Closed.',
};
// Settings fields are grouped into sections by these rules (first match wins).
const GROUPS = [
  ['Profile', /^(name|short_name|headline|photo|logo|favicon)$/],
  ['Contact & social links', /^(whatsapp|linkedin|x|github|contact_email|cta_|cv)/],
  ['Google & sharing', /(seo_|og_image|_title$|_description$)/],
  ['Newsletter', /^newsletter/],
  ['Ads', /^(ads?_|adsense)/],
  ['Menu & section labels', /^(nav_|tab_|.*_title$|footer)/],
  ['Links', /_url$/],
];
const IMG_KEY = /(image|logo|photo|favicon|avatar|icon|og_)/i;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const fd = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const today = () => new Date().toISOString().slice(0, 10);
const ago = d => { if (!d) return 'never'; const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const nice = k => NAMES[k] || (k.startsWith('nav_') ? 'Menu: ' + k.slice(4).replace(/_/g, ' ') : k.startsWith('tab_') ? 'Tab: ' + k.slice(4).replace(/_/g, ' ') : k.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()));
const isDraft = d => d.draft === true || String(d.draft).toLowerCase() === 'true';
let ME = {}; let dirty = false; let saveFn = null; const CACHE = {};

function toast(msg, er) { const d = document.createElement('div'); d.textContent = msg; if (er) d.className = 'er'; $('#toast').append(d); setTimeout(() => d.remove(), er ? 7000 : 3500); }
async function api(path, opts = {}) {
  const res = await fetch('/administrator/api/' + path, { method: opts.method || 'GET', headers: { 'X-Admin': '1', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== 'login') { renderLogin(); throw new Error('Session expired. Please sign in again.'); }
  if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
  if (opts.method && opts.method !== 'GET') { for (const k in CACHE) delete CACHE[k]; ALL = null; }
  return data;
}
async function busy(btn, fn) { const t = btn?.innerHTML; if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; } try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.innerHTML = t; } } }
function setDirty(v) { dirty = v; const b = $('.savebar'); if (b) { b.classList.toggle('dirty', v); $('.savebar .st span').textContent = v ? 'Unsaved changes' : 'All changes saved'; } }
/* ---------- Front matter (simple YAML: key: value). Falls back to raw text when it is more complex. ---------- */
function parseMd(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { fields: {}, body: text, raw: null };
  const fields = {}; let simple = true;
  let last = null;
  for (const line of m[1].split(/\r?\n/)) {
    if (!line.trim()) continue;
    // Wrapped YAML values continue on indented lines: join them back onto the previous field.
    if (/^\s+\S/.test(line) && last && !/^\s+-\s/.test(line)) { fields[last] = (fields[last] + ' ' + line.trim()).trim(); continue; }
    const kv = line.match(/^([A-Za-z0-9_]+):\s?(.*)$/);
    if (kv) last = kv[1];
    if (!kv) { simple = false; break; }
    let v = kv[2].trim();
    if (/^(['"]).*\1$/.test(v)) v = v.slice(1, -1).replace(/''/g, "'").replace(/\\"/g, '"');
    fields[kv[1]] = v;
  }
  return simple ? { fields, body: m[2], raw: null } : { fields: {}, body: m[2], raw: m[1] };
}
function yamlVal(v) { v = String(v ?? ''); if (v === '') return '""'; return /^[\w ./,()&!?@%+–—’'-]+$/.test(v) && !/^(true|false|null|yes|no|\d[\d.-]*)$/i.test(v) && !/: /.test(v) && !/^['"\-]/.test(v) && !/\d{4}-\d{2}-\d{2}/.test(v) ? v : (/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : JSON.stringify(v)); }
function buildMd(fields, body, raw) { const fm = raw != null ? raw : Object.entries(fields).map(([k, v]) => k + ': ' + yamlVal(v)).join('\n'); return '---\n' + fm + '\n---\n' + body.replace(/^\n+/, ''); }

/* ---------- Tiny markdown preview ---------- */
function md(src) {
  let h = esc(src);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => '<pre><code>' + c + '</code></pre>');
  h = h.replace(/^###### (.*)$/gm, '<h6>$1</h6>').replace(/^#### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  h = h.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/(?:^[-*] .*(?:\n|$))+/gm, b => '<ul>' + b.trim().split('\n').map(l => '<li>' + l.slice(2) + '</li>').join('') + '</ul>');
  h = h.replace(/(?:^\d+\. .*(?:\n|$))+/gm, b => '<ol>' + b.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>');
  return h.split(/\n{2,}/).map(p => /^\s*<(h\d|ul|ol|pre|blockquote|img)/.test(p) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}


/* ---------- Data helpers ---------- */
let ALL = null;
async function loadAll(fresh) {
  if (!fresh && ALL) return ALL;
  ALL = api('all').catch(e => { ALL = null; throw e; });
  return ALL;
}
async function loadItems(key, fresh) {
  const c = COLLECTIONS[key];
  if (!fresh && CACHE[key]) return CACHE[key];
  const rows = (await loadAll(fresh)).filter(f => f.path.startsWith(c.dir + '/') && !f.path.slice(c.dir.length + 1).includes('/'));
  return CACHE[key] = rows.filter(f => /\.(md|json)$/.test(f.name)).map(f => {
    let d = {}, body = '';
    try { if (c.type === 'md') { const p = parseMd(f.content); d = p.fields; body = p.body; if (p.raw) d = Object.fromEntries([...p.raw.matchAll(/^([A-Za-z0-9_]+):\s?(.*)$/gm)].map(m => [m[1], m[2].replace(/^["']|["']$/g, '')])); } else d = JSON.parse(f.content); } catch {}
    return { f, d, body };
  });
}
const titleOf = (it) => it.d.title || it.d.name || it.f.name.replace(/\.(md|json)$/, '');
function statusPill(it, key) {
  if (key === 'posts' || key === 'opportunities') {
    if (isDraft(it.d)) return `<span class="pill wa">Draft</span>${it.f.by === 'autopost' ? ' <span class="pill ac">Auto</span>' : ''}`;
    if (key === 'opportunities' && it.d.deadline && new Date(it.d.deadline) < new Date(today())) return '<span class="pill er">Closed</span>';
    if (key === 'opportunities' && !it.d.deadline) return '<span class="pill ok">Open</span> <span class="pill">No deadline</span>';
    return `<span class="pill ok">Live</span>${it.f.by === 'autopost' ? ' <span class="pill ac">Auto</span>' : ''}`;
  }
  return '';
}

async function route() {
  if (dirty && !confirm('You have unsaved changes. Leave without saving?')) { history.back(); return; }

  const h = location.hash.slice(1) || 'dashboard';

  refreshDraftBadge();

    if (a === 'c' && c) return await viewEditor(b, decodeURIComponent(c));

/* ---------- Search (Ctrl/Cmd K) ---------- */
async function openPalette() {
  const pal = $('#pal'), q = $('#palq'), ul = $('#pall'); pal.classList.add('on'); q.value = ''; q.focus();
  const nav = SECTIONS.flatMap(x => x.tabs.map(([t, l]) => ({ t: l, s: x.label, h: '#' + t })));
  const acts = Object.entries(COLLECTIONS).map(([k, c]) => ({ t: 'New ' + c.one, s: 'Create', h: `#c/${k}/new` }));
  let all = [...acts, ...nav]; let sel = 0;
  const draw = () => {
    const t = q.value.toLowerCase().trim();
    const hits = (t ? all.filter(x => (x.t + ' ' + x.s).toLowerCase().includes(t)) : all).slice(0, 40); sel = Math.min(sel, Math.max(0, hits.length - 1));
    ul.innerHTML = hits.map((x, i) => `<li><a href="${x.h}" class="${i === sel ? 'sel' : ''}">${esc(x.t)}<span>${esc(x.s)}</span></a></li>`).join('') || '<li class="empty">No matches</li>';
  };
  draw();
  Promise.all(Object.keys(COLLECTIONS).map(k => loadItems(k).then(items => items.map(it => ({ t: titleOf(it), s: COLLECTIONS[k].label, h: `#c/${k}/${encodeURIComponent(it.f.name)}` }))).catch(() => []))).then(r => { all = [...acts, ...nav, ...r.flat()]; draw(); });
  q.oninput = () => { sel = 0; draw(); };
  q.onkeydown = e => { const n = ul.querySelectorAll('a').length; if (e.key === 'ArrowDown') { sel = (sel + 1) % n; draw(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = (sel - 1 + n) % n; draw(); e.preventDefault(); } if (e.key === 'Enter') { const a = ul.querySelectorAll('a')[sel]; if (a) { location.hash = a.getAttribute('href'); pal.classList.remove('on'); } } };
  ul.onclick = () => pal.classList.remove('on'); pal.onclick = e => { if (e.target === pal) pal.classList.remove('on'); };
}

/* ---------- Fields ---------- */
function fieldInput(k, v, opts = {}) {
  const id = 'f_' + k;
  if (opts.list) return `<input id="${id}" data-k="${k}" value="${esc(v)}" list="dl_${k}"><datalist id="dl_${k}">${opts.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  if (IMG_KEY.test(k) || /pdf|^cv$/.test(k)) return `<div class="imgf">${v && IMG_KEY.test(k) ? `<img src="${esc(v)}" alt="">` : ''}<input id="${id}" data-k="${k}" value="${esc(v)}" placeholder="/uploads/…"><button class="btn" type="button" data-up="${id}">Upload</button></div>`;
  if (k === 'deadline') return `<div class="imgf"><input id="${id}" data-k="${k}" type="date" value="${esc(String(v || '').slice(0, 10))}"><button class="btn" type="button" data-nodl="${id}">No deadline</button></div>`;
  if (/date/i.test(k) && /^\d{4}-\d{2}-\d{2}/.test(String(v || '2000-01-01'))) return `<input id="${id}" data-k="${k}" type="date" value="${esc(String(v || '').slice(0, 10))}">`;
  if (typeof v === 'boolean' || /^(true|false)$/i.test(String(v))) return `<select id="${id}" data-k="${k}" data-bool="${typeof v === 'boolean' ? 'native' : 'str'}"><option value="true" ${String(v).toLowerCase() === 'true' ? 'selected' : ''}>Yes</option><option value="false" ${String(v).toLowerCase() !== 'true' ? 'selected' : ''}>No</option></select>`;
  if (Array.isArray(v)) return listEditor(k, v);
  if (v !== null && typeof v === 'object') return `<textarea class="code" id="${id}" data-k="${k}" data-json="1" rows="8">${esc(JSON.stringify(v, null, 2))}</textarea>`;
  if (typeof v === 'number') return `<input id="${id}" data-k="${k}" data-num="1" type="number" value="${v}">`;
  if (opts.big || String(v || '').length > 90) return `<textarea id="${id}" data-k="${k}">${esc(v)}</textarea>`;
  return `<input id="${id}" data-k="${k}" value="${esc(v)}">`;
}
const fieldBlock = (k, v, opts = {}) => `<div class="fld ${opts.full || Array.isArray(v) || /desc|text|paragraph/i.test(k) || String(v || '').length > 90 ? 'full' : ''}" data-name="${esc(k + ' ' + nice(k))}"><label>${esc(nice(k))}${HINTS[k] ? `<span class="hint">${HINTS[k]}</span>` : ''}</label>${fieldInput(k, v, opts)}</div>`;

// Repeatable list editor: arrays of text (paragraphs, tags) or of objects (services, tools).
function listEditor(k, arr) {
  const objs = arr.some(x => x && typeof x === 'object');
  const keys = objs ? [...new Set(arr.flatMap(x => Object.keys(x || {})))] : [];
  const item = (x, i) => objs
    ? `<div class="li"><div class="li-h"><b>${i + 1}. ${esc(x?.title || x?.name || '')}</b><span><button class="btn sm" type="button" data-mv="-1" title="Move up">↑</button><button class="btn sm" type="button" data-mv="1" title="Move down">↓</button><button class="btn sm d" type="button" data-rm>Remove</button></span></div><div class="row2">${keys.map(f => `<div class="${/text|desc/.test(f) ? 'full' : ''}"><label>${esc(f === 'name' ? 'Name' : f === 'text' ? 'Description' : nice(f))}</label>${/color/.test(f) ? `<div class="imgf"><input type="color" data-sub="${f}" value="${esc(x?.[f] || '#0f9f8f')}" style="width:52px;padding:2px"><input data-sub2="${f}" value="${esc(x?.[f] || '')}" oninput="this.previousElementSibling.value=this.value"></div>` : /text|desc/.test(f) ? `<textarea data-sub="${f}">${esc(x?.[f] || '')}</textarea>` : `<input data-sub="${f}" value="${esc(x?.[f] || '')}">`}</div>`).join('')}</div></div>`
    : `<div class="li" style="padding-top:10px"><div style="display:flex;gap:8px;align-items:start"><textarea data-sub="" style="min-height:${String(x).length > 60 ? 90 : 42}px">${esc(x)}</textarea><span style="display:flex;flex-direction:column;gap:4px"><button class="btn sm" type="button" data-mv="-1">↑</button><button class="btn sm" type="button" data-mv="1">↓</button><button class="btn sm d" type="button" data-rm>✕</button></span></div></div>`;
  setTimeout(() => {
    const box = document.getElementById('le_' + k); if (!box || box.dataset.wired) return; box.dataset.wired = 1;
    box.onclick = e => {
      const li = e.target.closest('.li'); const items = () => [...box.querySelectorAll(':scope>.items>.li')];
      if (e.target.closest('[data-rm]')) { if (confirm('Remove this item?')) { li.remove(); setDirty(true); } }
      else if (e.target.closest('[data-mv]')) { const d = +e.target.closest('[data-mv]').dataset.mv, all = items(), i = all.indexOf(li), j = i + d; if (j >= 0 && j < all.length) { d < 0 ? all[j].before(li) : all[j].after(li); setDirty(true); } }
      else if (e.target.closest('[data-add]')) { const t = document.createElement('div'); t.innerHTML = item(objs ? {} : '', items().length); box.querySelector('.items').append(t.firstElementChild); setDirty(true); }
    };
    box.addEventListener('input', e => { if (e.target.type === 'color') e.target.nextElementSibling.value = e.target.value; });
  });
  return `<div id="le_${k}" data-k="${k}" data-list="${objs ? 'obj' : 'str'}"><div class="items">${arr.map(item).join('')}</div><button class="btn" type="button" data-add>+ Add ${objs ? 'item' : 'line'}</button></div>`;
}
function readFields(scope) {
  const out = {};
  scope.querySelectorAll('[data-k]').forEach(el => {
    if (el.closest('[data-list]') && el.closest('[data-list]') !== el) return;
    let v;
    if (el.dataset.list) {
      const lis = el.querySelectorAll(':scope>.items>.li');
      v = [...lis].map(li => { if (el.dataset.list === 'str') return li.querySelector('[data-sub]').value; const o = {}; li.querySelectorAll('[data-sub],[data-sub2]').forEach(i => { if (i.type === 'color') return; const f = i.dataset.sub ?? i.dataset.sub2; if (i.value !== '') o[f] = i.value; }); return o; })
        .filter(x => typeof x === 'string' ? x.trim() : Object.keys(x).length);
    } else {
      v = el.value;
      if (el.dataset.json) { try { v = JSON.parse(v); } catch { throw new Error('"' + nice(el.dataset.k) + '" has a formatting error.'); } }
      else if (el.dataset.num) v = Number(v);
      else if (el.dataset.bool === 'native') v = v === 'true';
    }
    out[el.dataset.k] = v;
  });
  return out;
}
function wireUploads(scope) {
  scope.querySelectorAll('[data-up]').forEach(b => b.onclick = () => pickUpload(url => { const i = $('#' + b.dataset.up); i.value = url; i.dispatchEvent(new Event('input', { bubbles: true })); const img = i.previousElementSibling; if (img?.tagName === 'IMG') img.src = url; else if (IMG_KEY.test(i.dataset.k)) i.insertAdjacentHTML('beforebegin', `<img src="${esc(url)}" alt="">`); }));
  scope.querySelectorAll('[data-nodl]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.nodl); i.value = ''; setDirty(true); });
  scope.addEventListener('input', () => setDirty(true));
}

async function template(key) {
  const items = await loadItems(key).catch(() => []);
  const sample = items.find(i => !isDraft(i.d))?.d || items[0]?.d || {};
  const f = {};
  for (const k of Object.keys(sample)) { if (['source', 'source_url', 'draft'].includes(k)) continue; f[k] = Array.isArray(sample[k]) ? [] : sample[k] && typeof sample[k] === 'object' ? {} : typeof sample[k] === 'number' ? 0 : typeof sample[k] === 'boolean' ? false : ''; }
  if (!('title' in f) && !('name' in f)) f.title = '';
  if ('date' in f || key === 'posts') f.date = today();
  return f;
}

async function viewSettings(file) {
  const path = 'src/content/' + file, meta = SETTINGS[file] || { label: file, hint: '' };
  const r = await api('file?path=' + encodeURIComponent(path));
  let data = JSON.parse(r.content); let sha = r.sha;
  const isArr = Array.isArray(data);
  setHead(meta.label, `<button class="btn" id="mode">Advanced (JSON)</button>`);
  const wrapped = isArr ? { items: data } : data;
  let jsonMode = false;
  const form = () => {
    const keys = Object.keys(wrapped), used = new Set(), secs = [];
    for (const [name, re] of GROUPS) { const ks = keys.filter(k => !used.has(k) && re.test(k)); ks.forEach(k => used.add(k)); if (ks.length) secs.push([name, ks]); }
    const left = keys.filter(k => !used.has(k)); if (left.length) secs.unshift([keys.length === left.length ? '' : 'General', left]);
    return `<p class="sub">${meta.hint}</p>${keys.length > 6 ? `<input id="flt" placeholder="Find a setting…" style="margin-bottom:14px">` : ''}<div id="fm">${secs.map(([n, ks], i) => n ? `<details class="card sect" ${i < 2 ? 'open' : ''}><summary><h3>${n}</h3></summary><div class="row2">${ks.map(k => fieldBlock(k, wrapped[k])).join('')}</div></details>` : `<div class="card"><div class="row2">${ks.map(k => fieldBlock(k, wrapped[k], { full: true })).join('')}</div></div>`).join('')}</div>`;
  };

    $('#view').innerHTML = jsonMode ? `<p class="sub">Advanced: edit the raw data. Only use this if you know JSON.</p><div class="card"><textarea class="code" id="js" style="min-height:65vh">${esc(JSON.stringify(data, null, 2))}</textarea></div>` : form();
    if (!jsonMode) { wireUploads($('#view')); $('#flt') && ($('#flt').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('.fld').forEach(f => f.style.display = !q || f.dataset.name.toLowerCase().includes(q) ? '' : 'none'); if (q) document.querySelectorAll('details.sect').forEach(d => d.open = true); }); }
    else $('#js').oninput = () => setDirty(true);

      if (jsonMode) { try { data = JSON.parse($('#js').value); } catch { throw new Error('The JSON has a formatting error.'); } } else { const f = readFields($('#fm')); data = isArr ? f.items : f; }

}

/* ---------- Media ---------- */
function pickUpload(done) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*,application/pdf';
  i.onchange = async () => { const f = i.files[0]; if (!f) return; if (f.size > 8e6) return toast('Max file size is 8 MB.', true);
    toast('Uploading ' + f.name + '…');
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    const name = Date.now().toString(36) + '-' + f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
    try { await api('file', { method: 'PUT', body: { path: 'public/uploads/' + name, base64: b64, message: 'Upload ' + name } }); toast('Uploaded.'); done('/uploads/' + name); } catch (e) { toast(e.message, true); } };
  i.click();
}

  setHead('Media library', '<button class="btn p" id="up">Upload</button>');

  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.cp); toast('Copied ' + b.dataset.cp); });

}

      <div><label>Stories kept per category</label><input id="n_per" type="number" min="1" max="50" value="${cfg.perCategory}"></div>
      <div><label>Forget stories older than (days)</label><input id="n_age" type="number" min="1" max="60" value="${cfg.maxAgeDays}"></div>
      <div><label>Language and country<span class="hint">Google News edition: language, country, edition</span></label><div style="display:flex;gap:8px"><input id="n_hl" value="${esc(cfg.hl)}"><input id="n_gl" value="${esc(cfg.gl)}"><input id="n_ceid" value="${esc(cfg.ceid)}"></div></div>
      <div class="full"><label>Extra topics to watch<span class="hint">Comma separated. Tracked even if you have no posts in them yet.</span></label><input id="n_extra" value="${esc(cfg.extra.join(', '))}"></div>
      <div class="full"><label>Topics to skip<span class="hint">Comma separated.</span></label><input id="n_dis" value="${esc(cfg.disabled.join(', '))}"></div>
      <div class="full"><label>Search words per topic<span class="hint">One per line, like: Jobs = remote jobs hiring Nigeria</span></label><textarea class="code" id="n_q" rows="6">${esc(Object.entries(cfg.queries).map(([k, v]) => k + ' = ' + v).join('\n'))}</textarea></div>
    </div></details>
    <p style="margin:16px 0 0"><button class="btn p" id="nsave">Save settings</button></p></div>
    <details class="card sect"><summary><h3>Run history</h3></summary><table class="resp" style="margin-top:8px"><tr><th>When</th><th>Started by</th><th>Posts written</th><th>Stories</th></tr>${runs.map(r => `<tr><td>${new Date(r.at).toLocaleString()}</td><td class="mu">${/^manual/.test(r.trigger) ? 'You' : 'Schedule'}</td><td>${(r.posts || []).filter(x => x.created).length}</td><td class="mu">${r.fatal ? 'Could not run' : (r.total - r.failed) + ' of ' + r.total + ' topics fetched'}</td></tr>`).join('') || '<tr><td class="mu">No runs yet.</td></tr>'}</table></details>`;
  $('#run').onclick = e => busy(e.currentTarget, async () => { toast('Running… this can take up to a minute.'); const r = await api('news/run', { method: 'POST' }); if (!r.ok) throw new Error(r.error || 'Run failed'); const n = (r.run?.posts || []).filter(x => x.created).length; toast(r.skipped ? 'Another run is already in progress.' : n ? `Done: ${n} new post${n > 1 ? 's' : ''} written.` : 'Done: no new posts this time (no big enough fresh story).'); refreshDraftBadge(); viewNews(); });
  $('#tai').onclick = e => busy(e.currentTarget, async () => { const r = await api('news/test-ai', { method: 'POST' }); if (r.ok) toast(`AI writer is working (answered in ${(r.ms / 1000).toFixed(1)}s).`); else toast('AI writer problem: ' + r.error, true); });
  $('#nsave').onclick = e => busy(e.target, async () => {
    const queries = {}; $('#n_q').value.split('\n').forEach(l => { const i = l.indexOf('='); if (i > 0) queries[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
    await api('news/config', { method: 'PUT', body: { enabled: $('#n_enabled').value === 'true', autopost: { enabled: $('#a_on').value === 'true', publish: $('#a_pub').value === 'true', perCategoryPerDay: +$('#a_max').value, minScore: +$('#a_min').value }, sources: $('#n_src').value.split(','), window: $('#n_window').value.trim(), perCategory: +$('#n_per').value, maxAgeDays: +$('#n_age').value, hl: $('#n_hl').value.trim(), gl: $('#n_gl').value.trim(), ceid: $('#n_ceid').value.trim(), extra: $('#n_extra').value, disabled: $('#n_dis').value, queries } });
    toast('Saved. Applies from the next run.');
  });
}

async function boot() {
  ME = await api('me').catch(() => ({}));
  if (!ME.user) return renderLogin();
  shell(); route();
}
window.addEventListener('hashchange', () => ME.user && route());
boot();
</script>
</body>
</html>
