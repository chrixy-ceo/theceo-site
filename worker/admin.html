<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Site Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#14171f;--mu:#667085;--ln:#e4e7ec;--ac:#0f9f8f;--ac2:#0b7d71;--er:#d92d20;--ok:#079455;--wa:#dc6803;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1117;--pn:#161b22;--tx:#e6edf3;--mu:#8b949e;--ln:#30363d;--sh:none}}
:root[data-theme=dark]{--bg:#0d1117;--pn:#161b22;--tx:#e6edf3;--mu:#8b949e;--ln:#30363d;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--ln);background:var(--pn);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}.btn.d{color:var(--er)}.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
textarea{min-height:90px;resize:vertical}textarea.code{font:13px/1.55 ui-monospace,Menlo,monospace}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}label small{font-weight:400;color:var(--mu)}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;margin:4px 10px 18px}nav h1 span{color:var(--ac)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 10px 6px}
nav a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--tx);text-decoration:none}
nav a:hover{background:var(--bg)}nav a.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
main{padding:28px;max-width:1150px;width:100%}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.top h2{margin:0;font-size:22px;margin-right:auto}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600}
tr.row{cursor:pointer}tr.row:hover td{background:var(--bg)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--ln)}.pill.ok{color:var(--ok)}.pill.er{color:var(--er)}.pill.wa{color:var(--wa)}
.mu{color:var(--mu)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pv{border:1px solid var(--ln);border-radius:10px;padding:4px 16px;max-height:620px;overflow:auto;background:var(--bg)}.pv img{max-width:100%}
.imgf{display:flex;gap:8px;align-items:center}.imgf img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.media div{border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:12px;word-break:break-all}.media img{width:100%;height:110px;object-fit:cover;border-radius:6px;background:var(--bg)}
#toast{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:99}#toast div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--sh);max-width:380px}#toast div.er{background:var(--er);color:#fff}
.login{max-width:380px;margin:12vh auto}.chk li{margin:6px 0}
#mbtn{display:none}
#scrim{display:none}
@media(max-width:820px){#app{grid-template-columns:1fr}nav{position:fixed;inset:0 auto 0 0;width:min(300px,82vw);z-index:50;transform:translateX(-105%);transition:transform .22s ease;height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.4)}nav.open{transform:none}nav.open+#scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5)}
#mbtn{display:inline-block}main{padding:14px 14px 90px}.ed,.row2{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:-14px -14px 14px;padding:12px 14px;border-bottom:1px solid var(--ln)}.top h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actions{width:100%}#actions .btn{flex:1;text-align:center}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border-radius:12px}.stat b{font-size:22px}
table.resp thead,table.resp tr:has(th){display:none}table.resp tr{display:block;padding:12px 4px;border-bottom:1px solid var(--ln)}table.resp td{display:inline;border:0;padding:0 8px 0 0}table.resp td:first-child{display:block;margin-bottom:4px}
.pv{display:none}.ed.show-pv .pv{display:block}.ed.show-pv textarea{display:none}#pvt{display:inline-block!important}textarea.code{min-height:50vh!important}
input,select,textarea{font-size:16px}.media{grid-template-columns:1fr 1fr}#toast{left:12px;right:12px;bottom:12px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast"></div>
<script>
const COLLECTIONS = {
  posts:          { label: 'Blog posts',     dir: 'src/content/posts',          type: 'md',   public: s => '/blog/' + s + '/' },
  opportunities:  { label: 'Opportunities',  dir: 'src/content/opportunities',  type: 'md',   public: s => '/infobytes/' + s + '/' },
  pages:          { label: 'Pages',          dir: 'src/content/pages',          type: 'md',   public: s => '/' + s + '/' },
  projects:       { label: 'Projects',       dir: 'src/content/projects',       type: 'json', public: s => '/projects/' + s + '/' },
  certifications: { label: 'Certifications', dir: 'src/content/certifications', type: 'json' },
};
const SETTINGS = {
  'settings.json': 'Portfolio text, links & photo',
  'site.json': 'Ads, newsletter, Blog & Infobytes',
  'about.json': 'About section',
  'services.json': 'Services',
  'stack.json': 'Tech stack',
};
const IMG_KEY = /(image|logo|photo|favicon|avatar|icon|og_)/i;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const fd = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const today = () => new Date().toISOString().slice(0, 10);
const ago = d => { if (!d) return 'never'; const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
let ME = {}; let dirty = false;

function toast(msg, er) { const d = document.createElement('div'); d.textContent = msg; if (er) d.className = 'er'; $('#toast').append(d); setTimeout(() => d.remove(), er ? 7000 : 3500); }

async function api(path, opts = {}) {
  const res = await fetch('/administrator/api/' + path, { method: opts.method || 'GET', headers: { 'X-Admin': '1', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== 'login') { renderLogin(); throw new Error('Session expired. Please sign in again.'); }
  if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
  return data;
}
async function busy(btn, fn) { const t = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Working…'; } try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.textContent = t; } } }

/* ---------- Front matter (simple YAML: key: value). Falls back to raw text when it is more complex. ---------- */
function parseMd(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { fields: {}, body: text, raw: null };
  const fields = {}; let simple = true;
  let last = null;
  for (const line of m[1].split(/\r?\n/)) {
    if (!line.trim()) continue;
    // Wrapped YAML values continue on indented lines: join them back onto the previous field.
    if (/^\s+\S/.test(line) && last && !/^\s+-\s/.test(line)) { fields[last] = (fields[last] + ' ' + line.trim()).trim(); continue; }
    const kv = line.match(/^([A-Za-z0-9_]+):\s?(.*)$/);
    if (kv) last = kv[1];
    if (!kv) { simple = false; break; }
    let v = kv[2].trim();
    if (/^(['"]).*\1$/.test(v)) v = v.slice(1, -1).replace(/''/g, "'").replace(/\\"/g, '"');
    fields[kv[1]] = v;
  }
  return simple ? { fields, body: m[2], raw: null } : { fields: {}, body: m[2], raw: m[1] };
}
function yamlVal(v) { v = String(v ?? ''); if (v === '') return '""'; return /^[\w ./,()&!?@%+–—’'-]+$/.test(v) && !/^(true|false|null|yes|no|\d[\d.-]*)$/i.test(v) && !/: /.test(v) && !/^['"\-]/.test(v) && !/\d{4}-\d{2}-\d{2}/.test(v) ? v : (/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : JSON.stringify(v)); }
function buildMd(fields, body, raw) { const fm = raw != null ? raw : Object.entries(fields).map(([k, v]) => k + ': ' + yamlVal(v)).join('\n'); return '---\n' + fm + '\n---\n' + body.replace(/^\n+/, ''); }

/* ---------- Tiny markdown preview ---------- */
function md(src) {
  let h = esc(src);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => '<pre><code>' + c + '</code></pre>');
  h = h.replace(/^###### (.*)$/gm, '<h6>$1</h6>').replace(/^#### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  h = h.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/(?:^[-*] .*(?:\n|$))+/gm, b => '<ul>' + b.trim().split('\n').map(l => '<li>' + l.slice(2) + '</li>').join('') + '</ul>');
  h = h.replace(/(?:^\d+\. .*(?:\n|$))+/gm, b => '<ol>' + b.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>');
  return h.split(/\n{2,}/).map(p => /^\s*<(h\d|ul|ol|pre|blockquote|img)/.test(p) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

/* ---------- Shell ---------- */
function renderLogin(msg) {
  $('#root').innerHTML = `<div class="login card"><h2 style="margin-top:0">Admin sign in</h2>
    ${ME.configured === false ? '<p class="pill er">Not set up: add the ADMIN_PASSWORD secret to the Worker in Cloudflare.</p>' : ''}
    <form id="lf"><label>Username</label><input name="username" autocomplete="username" value="admin" required>
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="lerr" style="color:var(--er)">${esc(msg || '')}</p><button class="btn p" style="width:100%">Sign in</button></form></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target); try { await api('login', { method: 'POST', body: Object.fromEntries(f) }); boot(); } catch (er) { $('#lerr').textContent = er.message; } };
}
function shell() {
  const link = (h, t, extra = '') => `<a href="#${h}" data-h="${h}">${t}${extra}</a>`;
  $('#root').innerHTML = `<div id="app"><nav id="nav"><h1>The<span>CEO</span> Admin</h1>
    ${link('dashboard', 'Dashboard')}
    <div class="grp">Content</div>${Object.entries(COLLECTIONS).map(([k, c]) => link('c/' + k, c.label)).join('')}${link('media', 'Media library')}
    <div class="grp">Configuration</div>${Object.entries(SETTINGS).map(([f, l]) => link('s/' + f, l)).join('')}
    <div class="grp">Automation</div>${link('news', 'News feed (cron)')}
    <div class="grp">Account</div>${link('activity', 'Activity log')}<a href="/" target="_blank">View site ↗</a><a href="#" id="lo">Sign out</a></nav>
    <div id="scrim"></div><main><div class="top"><button class="btn" id="mbtn">☰</button><h2 id="title"></h2><div id="actions" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div id="view"></div></main></div>`;
  $('#lo').onclick = async e => { e.preventDefault(); await api('logout', { method: 'POST' }).catch(() => {}); renderLogin('Signed out.'); };
  $('#mbtn').onclick = () => $('#nav').classList.toggle('open'); $('#scrim').onclick = () => $('#nav').classList.remove('open');
}
function setHead(title, actions = '') { $('#title').textContent = title; $('#actions').innerHTML = actions; document.title = title + ' · Admin'; }

async function route() {
  if (dirty && !confirm('You have unsaved changes. Leave anyway?')) { history.back(); return; }
  dirty = false;
  const h = location.hash.slice(1) || 'dashboard';
  document.querySelectorAll('nav a[data-h]').forEach(a => a.classList.toggle('on', h === a.dataset.h || h.startsWith(a.dataset.h + '/')));
  $('#nav')?.classList.remove('open');
  $('#view').innerHTML = '<p class="mu">Loading…</p>';
  const [a, b, c] = h.split('/');
  try {
    if (a === 'dashboard') return await viewDashboard();
    if (a === 'c' && c) return await viewEditor(b, decodeURIComponent(c));
    if (a === 'c') return await viewList(b);
    if (a === 's') return await viewSettings(b);
    if (a === 'media') return await viewMedia();
    if (a === 'news') return await viewNews();
    if (a === 'activity') return await viewActivity();
    $('#view').textContent = 'Not found';
  } catch (e) { $('#view').innerHTML = `<div class="card"><b>Could not load.</b><p class="mu">${esc(e.message)}</p></div>`; }
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Dashboard ---------- */
async function viewDashboard() {
  setHead('Dashboard', `<a class="btn p" href="#c/posts/new">+ New post</a><a class="btn" href="#c/opportunities/new">+ New opportunity</a>`);
  const checks = [[ME.configured, 'Admin password set (ADMIN_PASSWORD)'], [ME.db, 'Content database connected (D1)'], [ME.media, 'Media storage connected (R2)'], [ME.kv, 'News storage connected (KV)']];
  $('#view').innerHTML = `<div class="grid" id="stats">${Object.entries(COLLECTIONS).map(([k, c]) => `<a class="card stat" href="#c/${k}" style="text-decoration:none;color:inherit"><b id="n-${k}">…</b><span>${c.label}</span></a>`).join('')}<a class="card stat" href="#news" style="text-decoration:none;color:inherit"><b id="n-news">…</b><span>News headlines</span></a></div>
    <div class="row2"><div class="card"><h3 style="margin-top:0">Setup</h3><ul class="chk">${checks.map(([ok, t]) => `<li>${ok ? '✅' : '⚠️'} ${t}</li>`).join('')}</ul><p class="mu">Content is stored in Cloudflare D1, and changes are saved instantly.</p></div>
    <div class="card"><h3 style="margin-top:0">Recent changes</h3><div id="rc" class="mu">Loading…</div></div></div>`;
  Object.entries(COLLECTIONS).forEach(([k, c]) => api('list?dir=' + c.dir).then(l => $('#n-' + k).textContent = l.filter(f => f.type === 'file').length).catch(() => $('#n-' + k).textContent = '–'));
  api('news/status').then(s => $('#n-news').textContent = (s.categories || []).reduce((a, c) => a + c.count, 0)).catch(() => $('#n-news').textContent = '–');
  api('commits').then(cs => $('#rc').innerHTML = cs.length === 0 ? 'No changes yet. Edits you make here will show up in this list.' : cs.slice(0, 6).map(c => `<div style="margin-bottom:8px"><b style="color:var(--tx)">${esc(c.message)}</b><br>${esc(c.author)} · ${ago(c.date)}</div>`).join('')).catch(e => $('#rc').textContent = e.message);
}

async function viewActivity() {
  setHead('Activity log');
  const cs = await api('commits');
  $('#view').innerHTML = `<div class="card"><table class="resp"><tr><th>Change</th><th>By</th><th>When</th><th>#</th></tr>${cs.map(c => `<tr><td>${esc(c.message)}</td><td>${esc(c.author)}</td><td>${ago(c.date)}</td><td class="mu">${esc(c.sha)}</td></tr>`).join('')}</table></div>`;
}

/* ---------- Collections ---------- */
async function loadItems(key) {
  const c = COLLECTIONS[key];
  const files = (await api('list?dir=' + c.dir)).filter(f => f.type === 'file' && /\.(md|json)$/.test(f.name));
  const out = await Promise.all(files.map(async f => {
    try { const r = await api('file?path=' + encodeURIComponent(f.path)); const d = c.type === 'md' ? parseMd(r.content).fields : JSON.parse(r.content); return { f, d }; } catch { return { f, d: {} }; }
  }));
  return out;
}
async function viewList(key) {
  const c = COLLECTIONS[key];
  setHead(c.label, `<a class="btn p" href="#c/${key}/new">+ New</a>`);
  const items = await loadItems(key);
  const cols = ['category', 'date', 'deadline', 'type'].filter(k => items.some(i => i.d[k]));
  items.sort((a, b) => String(b.d.date || b.d.deadline || '').localeCompare(String(a.d.date || a.d.deadline || '')));
  $('#view').innerHTML = `<div class="card"><input id="flt" placeholder="Search ${c.label.toLowerCase()}…" style="margin-bottom:10px"><table class="resp"><thead><tr><th>Title</th>${cols.map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>${items.map(({ f, d }) => `<tr class="row" data-p="${esc(f.name)}"><td><b>${esc(d.title || d.name || f.name)}</b></td>${cols.map(k => `<td class="mu">${k === 'deadline' && d[k] && new Date(d[k]) < new Date() ? `<span class="pill er">Closed ${fd(d[k])}</span>` : /date|deadline/.test(k) ? fd(d[k]) : k === 'category' && d[k] ? `<span class="pill">${esc(d[k])}</span>` : esc(d[k] || '')}</td>`).join('')}</tr>`).join('') || '<tr><td class="mu">Nothing here yet.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('tr.row').forEach(r => r.onclick = () => location.hash = 'c/' + key + '/' + encodeURIComponent(r.dataset.p));
  $('#flt').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('tr.row').forEach(r => r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'); };
}

function fieldInput(k, v, big) {
  const id = 'f_' + k;
  if (IMG_KEY.test(k)) return `<div class="imgf">${v ? `<img src="${esc(v)}" alt="">` : ''}<input id="${id}" data-k="${k}" value="${esc(v)}"><button class="btn" type="button" data-up="${id}">Upload</button></div>`;
  if (/date|deadline/i.test(k) && /^\d{4}-\d{2}-\d{2}/.test(v || '2000-01-01')) return `<input id="${id}" data-k="${k}" type="date" value="${esc(String(v || '').slice(0, 10))}">`;
  if (typeof v === 'boolean' || v === 'true' || v === 'false') return `<select id="${id}" data-k="${k}" data-bool="1"><option value="true" ${String(v) === 'true' ? 'selected' : ''}>Yes</option><option value="false" ${String(v) !== 'true' ? 'selected' : ''}>No</option></select>`;
  if (v !== null && typeof v === 'object') return `<textarea class="code" id="${id}" data-k="${k}" data-json="1" rows="8">${esc(JSON.stringify(v, null, 2))}</textarea>`;
  if (typeof v === 'number') return `<input id="${id}" data-k="${k}" data-num="1" type="number" value="${v}">`;
  if (big || String(v || '').length > 90) return `<textarea id="${id}" data-k="${k}">${esc(v)}</textarea>`;
  return `<input id="${id}" data-k="${k}" value="${esc(v)}">`;
}
const label = k => k.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
function readFields(scope) {
  const out = {};
  scope.querySelectorAll('[data-k]').forEach(el => {
    let v = el.value;
    if (el.dataset.json) { try { v = JSON.parse(v); } catch { throw new Error('"' + el.dataset.k + '" is not valid JSON.'); } }
    else if (el.dataset.num) v = Number(v);
    else if (el.dataset.bool && el.dataset.native) v = v === 'true';
    out[el.dataset.k] = v;
  });
  return out;
}
function wireUploads(scope) {
  scope.querySelectorAll('[data-up]').forEach(b => b.onclick = () => pickUpload(url => { const i = $('#' + b.dataset.up); i.value = url; i.dispatchEvent(new Event('input', { bubbles: true })); }));
  scope.addEventListener('input', () => dirty = true);
}

async function template(key) {
  // New items copy the field names of an existing item, so every collection gets the right fields.
  const items = await loadItems(key).catch(() => []);
  const sample = items[0]?.d || {};
  const f = {};
  for (const k of Object.keys(sample)) f[k] = typeof sample[k] === 'object' && sample[k] !== null ? (Array.isArray(sample[k]) ? [] : {}) : typeof sample[k] === 'number' ? 0 : typeof sample[k] === 'boolean' ? false : '';
  f.title = f.title ?? ''; if ('date' in f || key === 'posts') f.date = today();
  return f;
}

async function viewEditor(key, name) {
  const c = COLLECTIONS[key];
  const isNew = name === 'new';
  let data, sha = null, path = null, body = '', raw = null;
  if (isNew) { data = await template(key); }
  else {
    path = c.dir + '/' + name;
    const r = await api('file?path=' + encodeURIComponent(path)); sha = r.sha;
    if (c.type === 'md') { const p = parseMd(r.content); data = p.fields; body = p.body; raw = p.raw; } else data = JSON.parse(r.content);
  }
  const slug = name.replace(/\.(md|json)$/, '');
  setHead(isNew ? 'New ' + c.label.replace(/s$/, '').toLowerCase() : (data.title || data.name || name),
    `${!isNew && c.public ? `<a class="btn" target="_blank" href="${c.public(slug)}">View live ↗</a>` : ''}${!isNew ? '<button class="btn d" id="del">Delete</button>' : ''}<button class="btn p" id="save">${isNew ? 'Publish' : 'Save'}</button>`);
  const keys = Object.keys(data);
  $('#view').innerHTML = `<div class="card" id="fm">
      ${isNew ? `<label>File name (URL slug) <small>made from the title, you can change it</small></label><input id="slug" placeholder="my-new-post">` : ''}
      ${raw != null ? `<label>Front matter <small>(advanced YAML)</small></label><textarea class="code" id="raw" rows="10">${esc(raw)}</textarea>` : `<div class="row2">${keys.map(k => `<div style="${/desc|summary|excerpt|text|body/i.test(k) || typeof data[k] === 'object' ? 'grid-column:1/-1' : ''}"><label>${label(k)}</label>${fieldInput(k, data[k], /desc|summary|excerpt|text/i.test(k))}</div>`).join('')}</div>
      <details style="margin-top:14px"><summary class="mu" style="cursor:pointer">+ Add a field</summary><div style="display:flex;gap:8px;margin-top:8px"><input id="nk" placeholder="field_name"><button class="btn" id="addk" type="button">Add</button></div></details>`}
    </div>
    ${c.type === 'md' ? `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Content</b><span style="display:flex;gap:8px"><button class="btn" type="button" id="pvt" style="display:none">Preview</button><button class="btn" type="button" id="ins">Insert image</button></span></div>
      <div class="ed" style="margin-top:10px"><textarea class="code" id="body" style="min-height:560px">${esc(body)}</textarea><div class="pv ar" id="pv"></div></div></div>` : ''}`;
  wireUploads($('#view'));
  if (isNew) { const t = $('#f_title'); const s = $('#slug'); let touched = false; s.oninput = () => touched = true; t && (t.oninput = () => { if (!touched) s.value = slugify(t.value); }); }
  const bodyEl = $('#body');
  if (bodyEl) { const up = () => $('#pv').innerHTML = md(bodyEl.value); bodyEl.oninput = () => { dirty = true; up(); }; up();
    $('#pvt').onclick = () => { const e = $('.ed'); e.classList.toggle('show-pv'); $('#pvt').textContent = e.classList.contains('show-pv') ? 'Write' : 'Preview'; };
    $('#ins').onclick = () => pickUpload(url => { const at = bodyEl.selectionStart; bodyEl.setRangeText(`\n![](${url})\n`, at, at, 'end'); bodyEl.oninput(); }); }
  $('#addk') && ($('#addk').onclick = () => { const k = slugify($('#nk').value).replace(/-/g, '_'); if (!k) return; const d = document.createElement('div'); d.innerHTML = `<label>${label(k)}</label>${fieldInput(k, '')}`; $('#fm .row2').append(d); $('#nk').value = ''; });

  $('#save').onclick = e => busy(e.target, async () => {
    let content;
    if (c.type === 'md') { const f = raw != null ? null : readFields($('#fm')); content = buildMd(f, bodyEl.value, raw != null ? $('#raw').value : null); }
    else content = JSON.stringify(readFields($('#fm')), null, 2) + '\n';
    let p = path;
    if (isNew) { const s = slugify($('#slug').value || $('#f_title')?.value); if (!s) throw new Error('Add a title or file name first.'); p = c.dir + '/' + s + '.' + c.type; }
    const r = await api('file', { method: 'PUT', body: { path: p, content, sha, message: (isNew ? 'Create ' : 'Update ') + key + ' “' + p.split('/').pop() + '”' } });
    dirty = false; toast('Saved.');
    if (isNew) location.hash = 'c/' + key + '/' + encodeURIComponent(r.path.split('/').pop()); else { sha = r.sha; }
  });
  $('#del') && ($('#del').onclick = e => { if (!confirm('Delete this permanently?')) return; busy(e.target, async () => { await api('file', { method: 'DELETE', body: { path, sha } }); dirty = false; toast('Deleted.'); location.hash = 'c/' + key; }); });
}

/* ---------- Settings (single JSON files) ---------- */
async function viewSettings(file) {
  const path = 'src/content/' + file;
  const r = await api('file?path=' + encodeURIComponent(path));
  let data = JSON.parse(r.content); let sha = r.sha;
  const isArr = Array.isArray(data);
  setHead(SETTINGS[file] || file, `<button class="btn" id="mode">Edit as JSON</button><button class="btn p" id="save">Save</button>`);
  const wrapped = isArr ? { items: data } : data;
  const form = () => `<div class="card" id="fm"><input id="flt" placeholder="Filter settings…" style="margin-bottom:6px"><div class="row2">${Object.keys(wrapped).map(k => `<div class="fld" data-name="${esc(k)}" style="${typeof wrapped[k] === 'object' || String(wrapped[k]).length > 90 ? 'grid-column:1/-1' : ''}"><label>${label(k)} <small>${esc(k)}</small></label>${fieldInput(k, wrapped[k])}</div>`).join('')}</div></div>`;
  let jsonMode = false;
  const draw = () => {
    $('#view').innerHTML = jsonMode ? `<div class="card"><textarea class="code" id="js" style="min-height:70vh">${esc(JSON.stringify(data, null, 2))}</textarea></div>` : form();
    if (!jsonMode) { wireUploads($('#view')); $('#flt').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('.fld').forEach(f => f.style.display = f.textContent.toLowerCase().includes(q) || f.dataset.name.includes(q) ? '' : 'none'); }; document.querySelectorAll('select[data-bool]').forEach(s => s.dataset.native = typeof wrapped[s.dataset.k] === 'boolean' ? '1' : ''); }
    else $('#js').oninput = () => dirty = true;
  };
  draw();
  $('#mode').onclick = () => { try { if (!jsonMode) { const f = readFields($('#fm')); data = isArr ? f.items : f; } else data = JSON.parse($('#js').value); jsonMode = !jsonMode; $('#mode').textContent = jsonMode ? 'Edit as form' : 'Edit as JSON'; draw(); } catch (e) { toast(e.message, true); } };
  $('#save').onclick = e => busy(e.target, async () => {
    if (jsonMode) data = JSON.parse($('#js').value); else { const f = readFields($('#fm')); data = isArr ? f.items : f; }
    const res = await api('file', { method: 'PUT', body: { path, sha, content: JSON.stringify(data, null, 2) + '\n', message: 'Update settings “' + file + '”' } });
    sha = res.sha; dirty = false; toast('Settings saved.');
  });
}

/* ---------- Media ---------- */
function pickUpload(done) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*,application/pdf';
  i.onchange = async () => { const f = i.files[0]; if (!f) return; if (f.size > 8e6) return toast('Max file size is 8 MB.', true);
    toast('Uploading ' + f.name + '…');
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    const name = Date.now().toString(36) + '-' + f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
    try { await api('file', { method: 'PUT', body: { path: 'public/uploads/' + name, base64: b64, message: 'Upload ' + name } }); toast('Uploaded.'); done('/uploads/' + name); } catch (e) { toast(e.message, true); } };
  i.click();
}
async function viewMedia() {
  setHead('Media library', '<button class="btn p" id="up">Upload</button>');
  $('#up').onclick = () => pickUpload(() => viewMedia());
  const files = (await api('list?dir=public/uploads')).filter(f => f.type === 'file').sort((a, b) => b.name.localeCompare(a.name));
  $('#view').innerHTML = `<div class="media">${files.map(f => `<div>${/\.(png|jpe?g|gif|webp|svg|avif)$/i.test(f.name) ? `<img loading="lazy" src="/uploads/${esc(f.name)}" alt="">` : '<div class="mu" style="height:110px;display:grid;place-items:center">FILE</div>'}<p style="margin:6px 0">${esc(f.name)}<br><span class="mu">${Math.round(f.size / 1024)} KB</span></p><button class="btn" data-cp="/uploads/${esc(f.name)}">Copy URL</button> <button class="btn d" data-rm="${esc(f.path)}" data-sha="${f.sha}">✕</button></div>`).join('') || '<p class="mu">No files yet.</p>'}</div>`;
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.cp); toast('Copied ' + b.dataset.cp); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('Delete this file? Pages that use it will show a broken image.')) busy(b, async () => { await api('file', { method: 'DELETE', body: { path: b.dataset.rm, sha: b.dataset.sha } }); toast('Deleted.'); viewMedia(); }); });
}

/* ---------- News cron ---------- */
async function viewNews() {
  setHead('News feed', '<a class="btn" href="/news/" target="_blank">View page ↗</a><button class="btn p" id="run">Run now</button>');
  const s = await api('news/status');
  if (!s.kv) { $('#view').innerHTML = '<div class="card">⚠️ The NEWS KV namespace is not bound to the Worker. Deploy with the wrangler.jsonc in this repo.</div>'; return; }
  const last = s.runs[0]; const cfg = s.config;
  $('#view').innerHTML = `<div class="grid">
      <div class="card stat"><b>${s.config.enabled ? 'On' : 'Off'}</b><span>Hourly collection</span></div>
      <div class="card stat"><b>${ago(s.generated)}</b><span>Last update</span></div>
      <div class="card stat"><b>${s.categories.reduce((a, c) => a + c.count, 0)}</b><span>Headlines stored</span></div>
      <div class="card stat"><b>${last ? (last.ok ? '<span style="color:var(--ok)">Healthy</span>' : `<span style="color:var(--er)">${last.fatal ? 'Failed' : last.failed + ' failing'}</span>`) : '—'}</b><span>Last run${s.running ? ' (running now)' : ''}</span></div></div>
    <div class="card"><h3 style="margin-top:0">Categories</h3><table class="resp"><tr><th>Category</th><th>Headlines</th><th>Updated</th><th>Status</th></tr>${s.categories.map(c => `<tr><td>${esc(c.name)}</td><td>${c.count}</td><td>${ago(c.updated)}</td><td>${c.failures ? `<span class="pill er" title="${esc(c.error)}">${c.failures}× failed: ${esc(c.error)}</span>` : c.error ? `<span class="pill wa" title="${esc(c.error)}">Partial: ${esc(c.error)}</span>` : '<span class="pill ok">OK</span>'}</td></tr>`).join('') || '<tr><td class="mu">No runs yet. Click “Run now”.</td></tr>'}</table></div>
    <div class="card" id="nc"><h3 style="margin-top:0">Settings</h3><div class="row2">
      <div><label>Collection</label><select id="n_enabled"><option value="true" ${cfg.enabled ? 'selected' : ''}>Enabled (every hour)</option><option value="false" ${!cfg.enabled ? 'selected' : ''}>Paused</option></select></div>
      <div><label>Sources</label><select id="n_src"><option value="google,bing" ${(cfg.sources||[]).length===2?'selected':''}>Google News + Bing News</option><option value="google" ${(cfg.sources||[]).join()==='google'?'selected':''}>Google News only</option><option value="bing" ${(cfg.sources||[]).join()==='bing'?'selected':''}>Bing News only</option></select></div>
      <div><label>Freshness window <small>e.g. 1d, 12h</small></label><input id="n_window" value="${esc(cfg.window)}"></div>
      <div><label>Headlines per category</label><input id="n_per" type="number" min="1" max="50" value="${cfg.perCategory}"></div>
      <div><label>Drop items older than (days)</label><input id="n_age" type="number" min="1" max="60" value="${cfg.maxAgeDays}"></div>
      <div><label>Edition language <small>hl</small></label><input id="n_hl" value="${esc(cfg.hl)}"></div>
      <div><label>Country <small>gl / ceid</small></label><div style="display:flex;gap:8px"><input id="n_gl" value="${esc(cfg.gl)}"><input id="n_ceid" value="${esc(cfg.ceid)}"></div></div>
      <div style="grid-column:1/-1"><label>Extra categories <small>comma separated, tracked even with no posts</small></label><input id="n_extra" value="${esc(cfg.extra.join(', '))}"></div>
      <div style="grid-column:1/-1"><label>Skip categories <small>comma separated</small></label><input id="n_dis" value="${esc(cfg.disabled.join(', '))}"></div>
      <div style="grid-column:1/-1"><label>Custom search per category <small>one per line: Category = search terms. Default is the category name.</small></label><textarea class="code" id="n_q" rows="6" placeholder="Jobs = remote jobs hiring Nigeria&#10;Scholarships = scholarship for African students">${esc(Object.entries(cfg.queries).map(([k, v]) => k + ' = ' + v).join('\n'))}</textarea></div>
    </div><p><button class="btn p" id="nsave">Save settings</button></p></div>
    <div class="card"><h3 style="margin-top:0">Run history</h3><table class="resp"><tr><th>When</th><th>Trigger</th><th>Result</th><th>Time</th></tr>${s.runs.map(r => `<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.trigger)}</td><td>${r.fatal ? `<span class="pill er">${esc(r.fatal)}</span>` : r.ok ? `<span class="pill ok">${r.total} OK</span>` : `<span class="pill wa">${r.failed}/${r.total} failed</span>`}</td><td>${(r.ms / 1000).toFixed(1)}s</td></tr>`).join('') || '<tr><td class="mu">No runs yet.</td></tr>'}</table></div>`;
  $('#run').onclick = e => busy(e.target, async () => { const r = await api('news/run', { method: 'POST' }); if (r.ok) toast(r.skipped ? 'Skipped: ' + r.skipped : 'Done: ' + r.run.total + ' categories, ' + r.run.failed + ' failed'); else toast(r.error, true); viewNews(); });
  $('#nsave').onclick = e => busy(e.target, async () => {
    const queries = {}; $('#n_q').value.split('\n').forEach(l => { const i = l.indexOf('='); if (i > 0) queries[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
    await api('news/config', { method: 'PUT', body: { enabled: $('#n_enabled').value === 'true', sources: $('#n_src').value.split(','), window: $('#n_window').value.trim(), perCategory: +$('#n_per').value, maxAgeDays: +$('#n_age').value, hl: $('#n_hl').value.trim(), gl: $('#n_gl').value.trim(), ceid: $('#n_ceid').value.trim(), extra: $('#n_extra').value, disabled: $('#n_dis').value, queries } });
    toast('News settings saved. They apply from the next run.');
  });
}

async function boot() {
  ME = await api('me').catch(() => ({}));
  if (!ME.user) return renderLogin();
  shell(); route();
}
window.addEventListener('hashchange', () => ME.user && route());
boot();
</script>
